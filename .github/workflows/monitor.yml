name: Zyovex Instagram Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run Instagram monitor
        continue-on-error: true
        env:
          SCRAPFLY_API_KEY: ${{ secrets.SCRAPFLY_API_KEY }}
          CHANNEL_URLS: >-
            https://www.instagram.com/abcnews/,
            https://www.instagram.com/insideedition/,
            https://www.instagram.com/cnn/
        run: python instagram_monitor.py

      - name: Ensure Reel feed exists
        run: |
          if [ ! -f reels.json ]; then
            echo '{"success":false,"items":[],"errors":[{"error":"No reels.json was generated"}]}' > reels.json
          fi

      - name: Save Reel feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --soft origin/main

          git add -f reels.json
          git diff --cached --quiet || git commit -m "Update Reel feed"

          git push origin HEAD:main
